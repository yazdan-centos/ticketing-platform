server.port=8080

# --- Datasource ---
# Secrets come from the environment. DB_PASSWORD has no default on purpose so a
# real password is never committed; set it via env/secret manager before running.
spring.datasource.url=jdbc:postgresql://localhost/ticketing_platform_db
spring.datasource.username=postgres
spring.datasource.password=sgsec!1390
spring.datasource.driverClassName=org.postgresql.Driver

# --- JPA / Hibernate ---
# Schema is owned by Flyway; Hibernate only validates that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true

# --- Database initialization ---
# WARNING: true deletes all application data at every startup, then repopulates
# deterministic seed data. Set APP_DATABASE_INITIALIZE_ON_STARTUP=false to retain data.
app.database.initialize-on-startup=${APP_DATABASE_INITIALIZE_ON_STARTUP:true}

# --- JWT ---
# Override APP_JWT_SECRET in every real environment; the default is a dev-only key.
app.jwt.secret=VGlja2V0aW5nUGxhdGZvcm1Kd3RTZWNyZXRLZXlGb3JIUzI1NlNpZ25pbmc=
app.jwt.expiration=86400000

# --- CORS ---
# Comma-separated Spring origin patterns. Override in production with the exact
# HTTPS frontend origin, for example: https://tickets.example.com
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://155.117.13.33:*,http://localhost:*,http://127.0.0.1:*,http://10.*:*,http://172.*:*,http://192.168.*:*}

# --- File uploads ---
file.upload-dir=${user.home}/ticketing-platform/uploads
